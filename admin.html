<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asaib_Songs | لوحة الإدارة</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><i class="fas fa-user-shield"></i> لوحة تحكم الإدارة</h1>
            <p>إدارة محتوى قصائد عصائب أهل الحق</p>
        </div>
    </header>

    <main class="container" id="admin-main" style="display:none">
        
        <section id="add-song" class="card">
            <h2><i class="fas fa-plus-circle"></i> إضافة قصيدة جديدة</h2>
            <div class="form-group">
                <label for="song-name">اسم القصيدة</label>
                <input type="text" id="song-name" placeholder="مثال: حشد الله">
            </div>
            <div class="form-group">
                <label for="song-image">صورة الغلاف</label>
                <input type="file" id="song-image" accept="image/*">
            </div>
            <div class="form-group">
                <label for="song-audio">الملف الصوتي (MP3)</label>
                <input type="file" id="song-audio" accept="audio/*">
            </div>
            <button id="add-song-btn" class="btn primary-btn">
                <i class="fas fa-upload"></i> رفع القصيدة الآن
            </button>
        </section>

        <section id="songs-management">
            <h2><i class="fas fa-list-ul"></i> إدارة القصائد الحالية</h2>
            <div id="admin-songs-list" class="admin-grid">
                </div>
        </section>
    </main>

    <div id="edit-modal" class="modal" style="display:none">
        <div class="modal-content card">
            <h3>تعديل بيانات القصيدة</h3>
            <input type="hidden" id="edit-song-id">
            
            <div class="form-group">
                <label>الاسم الجديد</label>
                <input type="text" id="edit-song-name">
            </div>
            
            <div class="form-group">
                <label>تغيير الصورة (اختياري)</label>
                <input type="file" id="edit-song-image" accept="image/*">
            </div>

            <div class="modal-actions">
                <button onclick="window.closeEditModal()" class="btn secondary-btn">إلغاء</button>
                <button onclick="window.saveSongEdits()" class="btn success-btn">حفظ التغييرات</button>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>جميع الحقوق محفوظة © mujtaba muhamed</p>
        </div>
    </footer>

    <script type="module" src="script.js"></script>
</body>
</html>
