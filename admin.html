<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asaib_Songs | لوحة الإدارة</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><i class="fas fa-cog"></i> لوحة الإدارة</h1>
            <p>إضافة وحذف وتعديل الأغاني</p>
        </div>
    </header>

    <!-- Hidden by default — script.js reveals it only after Supabase confirms a valid session -->
    <main class="container" id="admin-main" style="display:none">
        <section id="add-song" class="card">
            <h2>قصائد عصائب اهل الحق</h2>
            <div class="form-group">
                <label for="song-name">اسم القصيدة</label>
                <input type="text" id="song-name" placeholder="أدخل اسم الأغنية">
            </div>
            <div class="form-group">
                <label for="song-image">ارفع صورة القصيدة</label>
                <input type="file" id="song-image" accept="image/*">
            </div>
            <div class="form-group">
                <label for="song-audio">ارفع ملف القصيدة</label>
                <input type="file" id="song-audio" accept="audio/*">
            </div>
            <button id="add-song-btn" class="btn"><i class="fas fa-plus"></i> إضافة</button>
        </section>

        <!-- FIX: was id="songs-list" which collided with the same ID used in script.js
             for the public songs grid. Renamed to "songs-section" to avoid the conflict.
             The actual grid div inside keeps id="admin-songs-list" which is what the script reads. -->
        <section id="songs-section">
            <h2>قائمة القصائد</h2>
            <div id="admin-songs-list"></div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>جميع الحقوق محفوظة © mujtaba muhamed</p>
        </div>
    </footer>

    <!-- FIX: type="module" required because script.js uses ES module import -->
    <script type="module" src="script.js"></script>
</body>
</html>
