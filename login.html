<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asaib_Songs</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1><i class="fas fa-lock"></i> تسجيل الدخول</h1>
            <form id="login-form">
                <div class="form-group">
                    <!-- FIX: was id="username", script.js reads id="email" -->
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn"><i class="fas fa-sign-in-alt"></i> دخول</button>
            </form>
            <p class="error-message" id="error-msg"></p>
        </div>
    </div>

    <!-- FIX: type="module" required because script.js uses ES module import -->
    <script type="module" src="script.js"></script>
</body>
</html>
